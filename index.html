<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rota Calendar</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 5px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    overflow: hidden;
}

.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 15px;
    text-align: center;
}

h1 {
    font-size: 1.8em;
    margin-bottom: 15px;
}

.button-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.view-btn,
.toggle-btn {
    padding: 10px 20px;
    font-size: 14px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    color: #333;
    border: 1px solid #666;
    background: linear-gradient(
        180deg,
        #e8e8e8 0%,
        #b8b8b8 50%,
        #a0a0a0 51%,
        #8a8a8a 100%
    );
    box-shadow:
        0 4px 8px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.5);
}

.view-btn.active,
.toggle-btn.active {
    transform: translateY(1px);
    background: linear-gradient(
        180deg,
        #707070 0%,
        #888 50%,
        #959595 51%,
        #a8a8a8 100%
    );
    color: white;
    box-shadow: inset 0 3px 5px rgba(0,0,0,.4);
}

.calendar-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
    background: #f8f9fa;
    border-bottom: 2px solid #e9ecef;
}

.nav-btn {
    padding: 8px 15px;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 0 4px 6px rgba(102,126,234,.4);
}

.month-year {
    font-size: 1.2em;
    font-weight: 600;
    color: #333;
}

.calendar {
    padding: 10px;
}

.weekdays,
.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
}

.weekdays {
    margin-bottom: 3px;
}

.weekday {
    text-align: center;
    font-weight: 600;
    color: #667eea;
    padding: 5px 2px;
    font-size: .75em;
}

.day {
    aspect-ratio: 1;
    border: 1px solid rgba(0,0,0,.2);
    border-radius: 15px;
    padding: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    position: relative;
    min-width: 0;
    box-shadow:
        0 3px 6px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.6);
}

.day.empty {
    cursor: default;
    background: transparent;
    border-color: transparent;
    box-shadow: none;
}

.day.today {
    border: 3px solid #667eea;
}

.day-number {
    font-weight: 400;
    font-size: .75em;
    color: #333;
}

.day-status {
    font-size: .55em;
    color: #333;
    text-align: center;
    margin-top: auto;
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.day-status.bold {
    font-weight: 700;
}

.day.off {
    background: linear-gradient(
        180deg,
        #f8f8f8 0%,
        #e8e8e8 50%,
        #e0e0e0 51%,
        #d8d8d8 100%
    );
}

.day.working {
    background: linear-gradient(
        180deg,
        #fff9c4 0%,
        #ffeb3b 50%,
        #fdd835 51%,
        #f9a825 100%
    );
}

.day.leave {
    background: linear-gradient(
        180deg,
        #b3e5fc 0%,
        #4fc3f7 50%,
        #29b6f6 51%,
        #03a9f4 100%
    );
}

.day.both-off {
    background: linear-gradient(
        180deg,
        #fecaca 0%,
        #fca5a5 50%,
        #f87171 51%,
        #ef4444 100%
    );
}

/* RED TODO DOT */

.todo-indicator {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 7px;
    height: 7px;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
    z-index: 5;
}

.todo-section {
    padding: 20px;
    background: #f8f9fa;
    border-top: 2px solid #e9ecef;
}

.todo-header {
    font-size: 1.3em;
    font-weight: 600;
    color: #333;
    margin-bottom: 15px;
    text-align: center;
}

.todo-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 400px;
    overflow-y: auto;
}

.todo-item {
    display: flex;
    gap: 10px;
    padding: 12px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 4px rgba(0,0,0,.1);
}

.todo-item.paul {
    align-self: flex-start;
    max-width: 80%;
}

.todo-item.rachel {
    align-self: flex-end;
    max-width: 80%;
}

.todo-date {
    font-size: .75em;
    color: #667eea;
    font-weight: 600;
    min-width: 60px;
}

.todo-content {
    flex: 1;
}

.todo-text {
    font-size: .9em;
    color: #666;
    line-height: 1.4;
}

.todo-empty {
    text-align: center;
    color: #999;
    padding: 40px 20px;
    font-style: italic;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
}

.modal-header {
    font-size: 1.5em;
    font-weight: 600;
    margin-bottom: 20px;
    color: #333;
}

.person-section {
    margin-bottom: 25px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 12px;
}

.person-title {
    font-size: 1.1em;
    font-weight: 600;
    color: #667eea;
    margin-bottom: 15px;
}

.status-toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.toggle-btn {
    flex: 1;
    padding: 12px;
}

.shift-input-container {
    display: none;
}

.shift-input-container.show {
    display: block;
}

.input-label {
    display: block;
    font-size: .9em;
    color: #666;
    margin-bottom: 8px;
    font-weight: 500;
}

.shift-input,
.todo-input {
    width: 100%;
    padding: 12px;
    border: 2px solid #e9ecef;
    border-radius: 8px;
    font-size: 14px;
}

.todo-input {
    min-height: 60px;
    resize: vertical;
    font-family: inherit;
    margin-top: 15px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

.modal-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
}

.save-btn {
    background: #667eea;
    color: white;
}

.cancel-btn {
    background: #e9ecef;
    color: #333;
}

.sync-status {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 15px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    font-size: .85em;
    color: #666;
    display: none;
}

.sync-status.show {
    display: block;
}

.sync-status.syncing {
    background: #fef3c7;
    color: #92400e;
}

.sync-status.synced {
    background: #dcfce7;
    color: #166534;
}

.sync-status.error {
    background: #fee2e2;
    color: #991b1b;
}

@media(max-width:768px) {

    .container {
        border-radius: 15px;
    }

    .calendar {
        padding: 8px;
    }

    .day {
        padding: 3px;
        border-radius: 6px;
    }

    .day-status {
        font-size: .5em;
    }

    .day-number {
        font-size: .7em;
    }

    .weekday {
        font-size: .7em;
        padding: 3px 1px;
    }

    .todo-item {
        max-width: 90% !important;
    }
}
</style>
</head>

            <div class="person-title">

            <div class="status-toggle">

                <button
                    class="toggle-btn"
                    data-person="yours"
                    data-status="working">
                    Working
                </button>

                <button
                    class="toggle-btn"
                    data-person="yours"
                    data-status="leave">
                    Leave
                </button>

                </button>

            <label class="input-label">
                To Do (Optional)

        <div class="modal-actions">

                Cancel

            <button

        </div>

    </div>

</div>


<div class="sync-status" id="syncStatus">
    Synced
</div>

/* =========================================================
   ROLLING ROTA
   ========================================================= */

/*
   Monday 21 September 2026 = WEEK 2

   Rotation:

   Week 2
   Week 3
   Week 4
   Week 5
   Week 1
   repeat
*/

const ROTA_START =
    new Date(2026, 8, 21);

const ROTA_END =
    new Date(2027, 8, 20);


/*
   Array positions:

   0 Monday
   1 Tuesday
   2 Wednesday
   3 Thursday
   4 Friday
   5 Saturday
   6 Sunday
*/

const ROLLING_ROTA = [

    /* =====================================================
       WEEK 2
       ===================================================== */

    {

        paul: [
            "",
            "",
            "",
            "",
            "6-18",

        ],

            ""
        ]

    },


    /* =====================================================

    {

        paul: [
            "18-06",

        ],

        rachel: [

            "7-19",

        ]

    },


    /* =====================================================
       WEEK 4
       ===================================================== */

    {

        paul: [
            "6-18",
            "14:30-02:30",
            "18-6",
            "",
            "",
            "",
            ""
        ],

        rachel: [
            "18-6",
            "",
            "",
            "",
            "",
            "",
            "6-18"
        ]

    },


    /* =====================================================
       WEEK 5
       ===================================================== */

    {

        paul: [
            "",
            "6-18",
            "6-18",
            "14:30-02:30",
            "18-6",
            "",
            ""
        ],

        rachel: [
            "7-19",
            "14:30-02:30",
            "18-6",
            "",
            "",
            "",
            ""
        ]

    },


    /* =====================================================
       WEEK 1
       ===================================================== */

    {

        paul: [
            "",
            "",
            "6-18",
            "6-18",
            "14:30-02:30",
            "14:30-02:30",
            ""
        ],

        rachel: [
            "6-18",
            "7-19",
            "14:30-02:30",
            "18-6",
            "",
            "",
            ""
        ]

    }

];


/* =========================================================
   VARIABLES
   ========================================================= */

let database = null;

let firebaseReady = false;


/*
   This contains only manual changes.

   Example:

   2026-10-06:
       Paul changed from 7-19 to 8-20

   The rolling rota itself is never modified.
*/

let rotaOverrides = {};


/*
   Keep the original rota database too.

   This is particularly important because your existing
   To Do items live there.
*/

let legacyRotaData = {};


let currentDate =
    new Date(2026, 8, 21);

let currentView =
    "mine";

let selectedDate =
    null;

let editingData = {

    mine: {
        status: "off",
        shift: "",
        todo: ""
    },

    yours: {
        status: "off",
        shift: "",
        todo: ""
    }

};

let touchStartX = 0;

let touchEndX = 0;


/* =========================================================
   DATE KEY
   ========================================================= */

function dateKey(date) {

    return (

        date.getFullYear() +
        "-" +
        String(date.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(date.getDate()).padStart(2, "0")

    );

}


/* =========================================================
   GET ROLLING ROTA
   ========================================================= */

function getRollingRota(date) {

    const d = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );


    if (
        d < ROTA_START ||
        d > ROTA_END
    ) {

        return null;

    }


    const daysSinceStart =
        Math.floor(
            (d - ROTA_START) /
            86400000
        );


    const weekIndex =
        Math.floor(
            daysSinceStart / 7
        ) % 5;


    const dayIndex =
        daysSinceStart % 7;


    const week =
        ROLLING_ROTA[weekIndex];


    const paulShift =
        week.paul[dayIndex];

    const rachelShift =
        week.rachel[dayIndex];


    return {

        mine: {

            status:
                paulShift
                    ? "working"
                    : "off",

            shift:
                paulShift || "",

            todo: ""

        },

        yours: {

            status:
                rachelShift
                    ? "working"
                    : "off",

            shift:
                rachelShift || "",

            todo: ""

        }

    };

}


/* =========================================================
   GET DAY DATA
   ========================================================= */

function getDayData(dateStr) {

    const date =
        new Date(
            dateStr + "T00:00:00"
        );


    const rolling =
        getRollingRota(date);


    /*
       Rolling rota dates:
       rolling rota + any manual override.
    */

    if (rolling) {

        const override =
            rotaOverrides[dateStr];


        if (override) {

            return {

                mine: {

                    ...rolling.mine,

                    ...(override.mine || {})

                },

                yours: {

                    ...rolling.yours,

                    ...(override.yours || {})

                }

            };

        }


        return rolling;

    }


    /*
       Outside the rolling period use
       manual data if available.
    */

    if (rotaOverrides[dateStr]) {

        return rotaOverrides[dateStr];

    }


    return {

        mine: {
            status: "off",
            shift: "",
            todo: ""
        },

        yours: {
            status: "off",
            shift: "",
            todo: ""
        }

    };

}


/* =========================================================
   SYNC MESSAGE
   ========================================================= */

function showSyncStatus(
    message,
    type
) {

    const element =
        document.getElementById(
            "syncStatus"
        );


    element.textContent =
        message;


    element.className =
        "sync-status show " +
        type;


    clearTimeout(
        showSyncStatus.timer
    );


    showSyncStatus.timer =
        setTimeout(
            function() {

                element.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   SAVE
   ========================================================= */

function saveData() {

    if (firebaseReady) {

        showSyncStatus(
            "Syncing...",
            "syncing"
        );


        database
            .ref("rotaOverrides")
            .set(rotaOverrides)

            .then(
                function() {

                    showSyncStatus(
                        "Synced",
                        "synced"
                    );

                }
            )

            .catch(
                function(error) {

                    console.error(
                        "Firebase save error:",
                        error
                    );

                    showSyncStatus(
                        "Sync failed",
                        "error"
                    );

                }
            );

    }

    else {

        try {

            localStorage.setItem(
                "rotaOverrides",
                JSON.stringify(
                    rotaOverrides
                )
            );

            showSyncStatus(
                "Saved",
                "synced"
            );

        }

        catch(error) {

            console.error(
                "Local save error:",
                error
            );

            showSyncStatus(
                "Save failed",
                "error"
            );

        }

    }

}


/* =========================================================
   LOAD
   ========================================================= */

function loadData() {

    if (firebaseReady) {

        /*
           Load manual overrides.
        */

        database
            .ref("rotaOverrides")
            .on(
                "value",
                function(snapshot) {

                    const data =
                        snapshot.val();


                    rotaOverrides =
                        data &&
                        typeof data === "object"
                            ? data
                            : {};


                    renderCalendar();

                },

                function(error) {

                    console.error(
                        "Firebase override error:",
                        error
                    );

                }
            );


        /*
           Load original rota.

           This is where your old To Do entries
           are retrieved.
        */

        database
            .ref("rota")
            .once("value")

            .then(
                function(snapshot) {

                    const data =
                        snapshot.val();


                    legacyRotaData =
                        data &&
                        typeof data === "object"
                            ? data
                            : {};


                    renderCalendar();

                }
            )

            .catch(
                function(error) {

                    console.error(
                        "Firebase legacy data error:",
                        error
                    );

                }
            );

    }

    else {

        try {

            rotaOverrides =
                JSON.parse(
                    localStorage.getItem(
                        "rotaOverrides"
                    ) || "{}"
                );

        }

        catch(error) {

            rotaOverrides = {};

        }


        try {

            legacyRotaData =
                JSON.parse(
                    localStorage.getItem(
                        "rotaData"
                    ) || "{}"
                );

        }

        catch(error) {

            legacyRotaData = {};

        }


        renderCalendar();

    }

}


/* =========================================================
   DRAW WORKING/OFF/LEAVE
   ========================================================= */

function setDayDisplay(
    element,
    statusElement,
    data
) {

    if (
        data.status === "off"
    ) {

        element.classList.add(
            "off"
        );

        statusElement.textContent =
            "Day Off";

    }

    else if (
        data.status === "leave"
    ) {

        element.classList.add(
            "leave"
        );

        statusElement.textContent =
            "Leave";

    }

    else {

        element.classList.add(
            "working"
        );

        statusElement.textContent =
            data.shift ||
            "Working";


        if (data.shift) {

            statusElement.classList.add(
                "bold"
            );

        }

    }

}


/* =========================================================
   CALENDAR
   ========================================================= */

function renderCalendar() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    document.getElementById(
        "monthYear"
    ).textContent =

        new Date(
            year,
            month,
            1
        ).toLocaleDateString(
            "en-GB",
            {
                month: "long",
                year: "numeric"
            }
        );


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const offset =
        firstDay === 0
            ? 6
            : firstDay - 1;


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const container =
        document.getElementById(
            "days"
        );


    container.innerHTML = "";


    for (
        let i = 0;
        i < offset;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "day empty";

        container.appendChild(
            empty
        );

    }


    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                year,
                month,
                day
            );


        const key =
            dateKey(date);


        const data =
            getDayData(key);


        /*
           IMPORTANT:

           Check BOTH the new data AND the old
           Firebase rota for To Do items.

           This restores the red dots.
        */

        const legacyData =
            legacyRotaData[key] || {};


        const dayElement =
            document.createElement(
                "div"
            );

        dayElement.className =
            "day";


        if (
            date.getTime() ===
            today.getTime()
        ) {

            dayElement.classList.add(
                "today"
            );

        }


        /*
           RED TODO DOT
        */

        const hasTodo =

            (
                data.mine &&
                data.mine.todo
            ) ||

            (
                data.yours &&
                data.yours.todo
            ) ||

            (
                legacyData.mine &&
                legacyData.mine.todo
            ) ||

            (
                legacyData.yours &&
                legacyData.yours.todo
            );


        if (hasTodo) {

            const indicator =
                document.createElement(
                    "div"
                );

            indicator.className =
                "todo-indicator";

            dayElement.appendChild(
                indicator
            );

        }


        const number =
            document.createElement(
                "div"
            );

        number.className =
            "day-number";

        number.textContent =
            day;


        const status =
            document.createElement(
                "div"
            );

        status.className =
            "day-status";


        if (
            currentView === "mine"
        ) {

            setDayDisplay(
                dayElement,
                status,
                data.mine
            );

        }

        else if (
            currentView === "yours"
        ) {

            setDayDisplay(
                dayElement,
                status,
                data.yours
            );

        }

        else {

            if (

                data.mine.status === "off"

                &&

                data.yours.status === "off"

            ) {

                dayElement.classList.add(
                    "both-off"
                );

                status.textContent =
                    "Both Off";

            }

            else {

                status.textContent =
                    "-";

            }

        }


        dayElement.appendChild(
            number
        );

        dayElement.appendChild(
            status
        );


        dayElement.addEventListener(
            "click",
            function() {

                openModal(key);

            }
        );


        container.appendChild(
            dayElement
        );

    }


    renderTodoList();

}


/* =========================================================
   TODO LIST
   ========================================================= */

function renderTodoList() {

    const list =
        document.getElementById(
            "todoList"
        );


    list.innerHTML = "";


    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );


    const items = [];


    /*
       NEW OVERRIDES
    */

    Object.entries(
        rotaOverrides
    ).forEach(
        function([
            key,
            data
        ]) {

            const date =
                new Date(
                    key + "T00:00:00"
                );


            if (
                date.getFullYear() !== year ||
                date.getMonth() !== month ||
                date < today
            ) {

                return;

            }


            if (
                data.mine &&
                data.mine.todo
            ) {

                items.push({

                    date: key,

                    person: "paul",

                    todo:
                        data.mine.todo

                });

            }


            if (
                data.yours &&
                data.yours.todo
            ) {

                items.push({

                    date: key,

                    person: "rachel",

                    todo:
                        data.yours.todo

                });

            }

        }
    );


    /*
       OLD DATA

       This keeps existing To Dos visible.
    */

    Object.entries(
        legacyRotaData
    ).forEach(
        function([
            key,
            data
        ]) {

            const date =
                new Date(
                    key + "T00:00:00"
                );


            if (
                date.getFullYear() !== year ||
                date.getMonth() !== month ||
                date < today
            ) {

                return;

            }


            const override =
                rotaOverrides[key];


            if (
                !override?.mine?.todo &&
                data.mine &&
                data.mine.todo
            ) {

                items.push({

                    date: key,

                    person: "paul",

                    todo:
                        data.mine.todo

                });

            }


            if (
                !override?.yours?.todo &&
                data.yours &&
                data.yours.todo
            ) {

                items.push({

                    date: key,

                    person: "rachel",

                    todo:
                        data.yours.todo

                });

            }

        }
    );


    /*
       Remove duplicates.
    */

    const unique =
        [];


    const seen =
        new Set();


    items.forEach(
        function(item) {

            const id =
                item.date +
                "|" +
                item.person +
                "|" +
                item.todo;


            if (!seen.has(id)) {

                seen.add(id);

                unique.push(item);

            }

        }
    );


    unique.sort(
        function(a,b) {

            return a.date.localeCompare(
                b.date
            );

        }
    );


    if (!unique.length) {

        list.innerHTML =
            '<div class="todo-empty">No tasks scheduled for this month</div>';

        return;

    }


    unique.forEach(
        function(item) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "todo-item " +
                item.person;


            const dateElement =
                document.createElement(
                    "div"
                );

            dateElement.className =
                "todo-date";


            dateElement.textContent =

                new Date(
                    item.date +
                    "T00:00:00"
                ).toLocaleDateString(
                    "en-GB",
                    {
                        day: "numeric",
                        month: "short"
                    }
                );


            const content =
                document.createElement(
                    "div"
                );

            content.className =
                "todo-content";


            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "todo-text";

            text.textContent =
                item.todo;


            content.appendChild(
                text
            );


            row.appendChild(
                dateElement
            );

            row.appendChild(
                content
            );


            list.appendChild(
                row
            );

        }
    );

}


/* =========================================================
   OPEN MODAL
   ========================================================= */

function openModal(dateStr) {

    selectedDate =
        dateStr;


    const data =
        getDayData(
            dateStr
        );


    /*
       Include existing old To Dos if they haven't
       been moved into the new override yet.
    */

    const oldData =
        legacyRotaData[dateStr];


    if (
        oldData
    ) {

        if (
            !data.mine.todo &&
            oldData.mine &&
            oldData.mine.todo
        ) {

            data.mine.todo =
                oldData.mine.todo;

        }


        if (
            !data.yours.todo &&
            oldData.yours &&
            oldData.yours.todo
        ) {

            data.yours.todo =
                oldData.yours.todo;

        }

    }


    editingData =
        JSON.parse(
            JSON.stringify(
                data
            )
        );


    const date =
        new Date(
            dateStr +
            "T00:00:00"
        );


    document.getElementById(
        "modalHeader"
    ).textContent =

        date.toLocaleDateString(
            "en-GB",
            {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );


    updateModalPerson(
        "mine"
    );

    updateModalPerson(
        "yours"
    );


    document.getElementById(
        "modal"
    ).classList.add(
        "show"
    );

}


/* =========================================================
   UPDATE MODAL PERSON
   ========================================================= */

function updateModalPerson(
    person
) {

    const data =
        editingData[person];


    document.getElementById(
        person + "Shift"
    ).value =
        data.shift || "";


    document.getElementById(
        person + "Todo"
    ).value =
        data.todo || "";


    document.getElementById(
        person + "ShiftContainer"
    ).classList.toggle(
        "show",
        data.status === "working"
    );


    document
        .querySelectorAll(
            '.toggle-btn[data-person="' +
            person +
            '"]'
        )
        .forEach(
            function(button) {

                button.classList.toggle(
                    "active",
                    button.dataset.status ===
                    data.status
                );

            }
        );

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal() {

    document.getElementById(
        "modal"
    ).classList.remove(
        "show"
    );


    selectedDate =
        null;

}


/* =========================================================
   SAVE DAY
   ========================================================= */

function saveDay() {

    if (!selectedDate) {
        return;
    }


    /*
       SAVE AS AN OVERRIDE.

       This is what makes a change such as:

       7-19 → 8-20

       permanent.
    */

    rotaOverrides[
        selectedDate
    ] =
        JSON.parse(
            JSON.stringify(
                editingData
            )
        );


    saveData();

    renderCalendar();

    closeModal();

}


/* =========================================================
   BUTTONS AND SWIPES
   ========================================================= */

function setupEventListeners() {


    /*
       PREVIOUS
    */

    document
        .getElementById(
            "prevMonth"
        )
        .addEventListener(
            "click",
            function() {

                currentDate.setMonth(
                    currentDate.getMonth() - 1
                );

                renderCalendar();

            }
        );


    /*
       NEXT
    */

    document
        .getElementById(
            "nextMonth"
        )
        .addEventListener(
            "click",
            function() {

                currentDate.setMonth(
                    currentDate.getMonth() + 1
                );

                renderCalendar();

            }
        );


    /*
       PAUL / RACHEL / BOTH
    */

    document
        .querySelectorAll(
            ".view-btn"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        document
                            .querySelectorAll(
                                ".view-btn"
                            )
                            .forEach(
                                function(b) {

                                    b.classList.remove(
                                        "active"
                                    );

                                }
                            );


                        button.classList.add(
                            "active"
                        );


                        currentView =
                            button.dataset.view;


                        renderCalendar();

                    }
                );

            }
        );


    /*
       WORKING / LEAVE / DAY OFF
    */

    document
        .querySelectorAll(
            ".toggle-btn"
        )
        .forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        const person =
                            button.dataset.person;

                        const status =
                            button.dataset.status;


                        editingData[
                            person
                        ].status =
                            status;


                        if (
                            status !==
                            "working"
                        ) {

                            editingData[
                                person
                            ].shift = "";

                        }


                        document
                            .querySelectorAll(
                                '.toggle-btn[data-person="' +
                                person +
                                '"]'
                            )
                            .forEach(
                                function(b) {

                                    b.classList.toggle(
                                        "active",
                                        b === button
                                    );

                                }
                            );


                        document
                            .getElementById(
                                person +
                                "ShiftContainer"
                            )
                            .classList.toggle(
                                "show",
                                status === "working"
                            );

                    }
                );

            }
        );


    /*
       SHIFT INPUTS
    */

    document
        .getElementById(
            "mineShift"
        )
        .addEventListener(
            "input",
            function(event) {

                editingData.mine.shift =
                    event.target.value;

            }
        );


    document
        .getElementById(
            "yoursShift"
        )
        .addEventListener(
            "input",
            function(event) {

                editingData.yours.shift =
                    event.target.value;

            }
        );


    /*
       TODO INPUTS
    */

    document
        .getElementById(
            "mineTodo"
        )
        .addEventListener(
            "input",
            function(event) {

                editingData.mine.todo =
                    event.target.value;

            }
        );


    document
        .getElementById(
            "yoursTodo"
        )
        .addEventListener(
            "input",
            function(event) {

                editingData.yours.todo =
                    event.target.value;

            }
        );


    /*
       CANCEL
    */

    document
        .getElementById(
            "cancelBtn"
        )
        .addEventListener(
            "click",
            closeModal
        );


    /*
       SAVE
    */

    document
        .getElementById(
            "saveBtn"
        )
        .addEventListener(
            "click",
            saveDay
        );


    /*
       TAP OUTSIDE MODAL
    */

    document
        .getElementById(
            "modal"
        )
        .addEventListener(
            "click",
            function(event) {

                if (
                    event.target.id ===
                    "modal"
                ) {

                    closeModal();

                }

            }
        );


    /*
       SWIPE BETWEEN MONTHS
    */

    const calendar =
        document.querySelector(
            ".calendar"
        );


    calendar.addEventListener(
        "touchstart",
        function(event) {

            touchStartX =
                event.changedTouches[0]
                    .screenX;

        },
        {
            passive: true
        }
    );


    calendar.addEventListener(
        "touchend",
        function(event) {

            touchEndX =
                event.changedTouches[0]
                    .screenX;


            const difference =
                touchStartX -
                touchEndX;


            if (
                Math.abs(difference) > 50
            ) {

                if (
                    difference > 0
                ) {

                    currentDate.setMonth(
                        currentDate.getMonth() + 1
                    );

                }

                else {

                    currentDate.setMonth(
                        currentDate.getMonth() - 1
                    );

                }


                renderCalendar();

            }

        },
        {
            passive: true
        }
    );

}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    "load",
    function() {

        setupEventListeners();


        try {

            if (
                typeof firebase !==
                "undefined"
            ) {

                firebase.initializeApp(
                    firebaseConfig
                );


                database =
                    firebase.database();


                firebaseReady =
                    true;

            }

        }

        catch(error) {

            console.error(
                "Firebase initialization error:",
                error
            );

            firebaseReady =
                false;

        }


        loadData();

        renderCalendar();

    }
);

</script>
