<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rota Calendar</title>

<style>
:root{
    --blue:#3d7ff5;
    --blue-dark:#165dd8;
    --ink:#0d1730;
    --muted:#667085;
    --glass:rgba(246,249,255,.70);
    --glass-white:rgba(255,255,255,.62);
    --glass-border:rgba(255,255,255,.78);
    --shadow:0 18px 45px rgba(40,70,130,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
    min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
    color:var(--ink);
}
body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 60% 50% at 2% 8%,rgba(70,139,255,.95) 0%,rgba(70,139,255,.45) 48%,transparent 72%),
      radial-gradient(ellipse 55% 48% at 100% 2%,rgba(170,137,255,.82) 0%,rgba(170,137,255,.38) 50%,transparent 75%),
      radial-gradient(ellipse 70% 55% at 80% 100%,rgba(93,161,255,.70) 0%,transparent 65%),
      linear-gradient(145deg,#77a8ff 0%,#9abaff 44%,#c5b7ff 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    padding-bottom:112px;
}
body:after{
    content:"";
    position:fixed;
    width:520px;height:520px;
    left:-250px;top:120px;
    border-radius:50%;
    background:rgba(255,255,255,.09);
    filter:blur(30px);
    pointer-events:none;
}
.container{
    width:min(100%,760px);
    margin:0 auto;
    padding:42px 18px 125px;
}
.app-page{display:none}
.app-page.active{display:block}

/* ---------- ROTA ---------- */
.header{color:white;padding:0 22px 20px}
.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
}
h1{
    font-size:clamp(38px,8vw,60px);
    line-height:.98;
    letter-spacing:-.055em;
    font-weight:760;
    text-shadow:0 2px 8px rgba(30,60,130,.10);
}
.header-icon{
    width:62px;height:62px;
    border-radius:50%;
    display:grid;place-items:center;
    background:rgba(255,255,255,.19);
    border:1px solid rgba(255,255,255,.48);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 8px 22px rgba(20,60,140,.12);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    color:white;
    font-size:29px;
}
.segmented{
    height:58px;
    margin-top:22px;
    padding:4px;
    display:flex;
    border-radius:32px;
    background:rgba(82,137,231,.28);
    border:1px solid rgba(255,255,255,.42);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 9px 25px rgba(20,60,140,.12);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
}
.view-btn{
    flex:1;
    border:0;
    background:transparent;
    color:rgba(255,255,255,.94);
    border-radius:28px;
    font-size:20px;
    font-weight:500;
    cursor:pointer;
}
.view-btn.active{
    color:#172033;
    background:rgba(255,255,255,.91);
    box-shadow:0 3px 10px rgba(45,70,120,.13),inset 0 1px rgba(255,255,255,.95);
}

.glass-card{
    background:rgba(239,245,255,.69);
    border:1px solid rgba(255,255,255,.76);
    box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.76);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}
.calendar-card{
    border-radius:30px;
    padding:24px 17px 22px;
}
.calendar-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4px 20px;
}
.month-year{
    font-size:29px;
    font-weight:760;
    letter-spacing:-.045em;
}
.nav-btn{
    width:54px;height:54px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.78);
    background:rgba(255,255,255,.48);
    box-shadow:0 5px 17px rgba(35,65,120,.09),inset 0 1px rgba(255,255,255,.8);
    color:#172033;
    font-size:36px;
    line-height:1;
    display:grid;
    place-items:center;
    cursor:pointer;
}
.weekdays,.days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
}
.weekday{
    text-align:center;
    color:#66748d;
    font-size:14px;
    font-weight:650;
    letter-spacing:.02em;
    padding:2px 0 9px;
}
.day{
    aspect-ratio:1/1;
    min-width:0;
    padding:7px 6px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.72);
    background:rgba(249,251,255,.57);
    box-shadow:0 4px 11px rgba(40,60,100,.045),inset 0 1px rgba(255,255,255,.75);
    cursor:pointer;
}
.day.empty{
    background:transparent;
    border-color:transparent;
    box-shadow:none;
    cursor:default;
}
.day.today{
    outline:3px solid #397cf1;
    outline-offset:-2px;
}
.day-number{
    color:#182033;
    font-size:16px;
    font-weight:650;
}
.day-status{
    margin-top:auto;
    text-align:center;
    color:#151c2d;
    font-size:13px;
    line-height:1.05;
    font-weight:520;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.day-status.bold{font-weight:760}
.day.off{background:rgba(247,249,253,.60)}
.day.off .day-status{
    color:#8b94a6;
    font-weight:500;
}
.day.working{
    background:linear-gradient(180deg,rgba(255,221,96,.93),rgba(253,199,44,.97));
}
.day.shift-relief{
    background:linear-gradient(180deg,rgba(171,229,175,.93),rgba(132,210,138,.97));
}
.day.shift-late{
    background:linear-gradient(180deg,rgba(255,187,133,.93),rgba(253,154,80,.97));
}
.day.shift-night{
    background:linear-gradient(180deg,rgba(221,188,255,.93),rgba(196,151,252,.97));
}
.day.leave{
    background:linear-gradient(180deg,rgba(149,205,255,.90),rgba(93,178,252,.94));
}
.day.both-off{
    background:linear-gradient(180deg,rgba(255,183,190,.90),rgba(255,148,160,.94));
}
.day-indicators{
    position:absolute;
    top:8px;right:8px;
    display:flex;
    align-items:center;
    gap:4px;
}
.day-dot{
    width:9px;height:9px;
    border-radius:50%;
}
.day-dot.todo{
    background:#ff3b30;
    box-shadow:0 1px 5px rgba(255,59,48,.35);
}
.day-dot.birthday{
    background:#2f7cf6;
    box-shadow:0 1px 5px rgba(47,124,246,.38);
}

/* ---------- LIST PAGES ---------- */
.page-header{
    color:white;
    padding:8px 20px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.page-title-wrap{
    display:flex;
    align-items:center;
    gap:14px;
}
.page-icon{
    width:58px;height:58px;
    border-radius:19px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.20);
    border:1px solid rgba(255,255,255,.45);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    font-size:27px;
}
.page-title{
    font-size:36px;
    font-weight:760;
    letter-spacing:-.05em;
}
.page-subtitle{
    margin-top:3px;
    font-size:14px;
    color:rgba(255,255,255,.78);
}
.list-card{
    padding:7px 20px;
    border-radius:30px;
    overflow:hidden;
}
.list-row{
    min-height:76px;
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 0;
    border-bottom:1px solid rgba(88,105,135,.13);
    cursor:pointer;
}
.list-row:last-child{border-bottom:0}
.list-date{
    min-width:82px;
    color:#3278ee;
    font-size:14px;
    font-weight:720;
}
.list-main{flex:1;min-width:0}
.list-text{
    color:#151d30;
    font-size:17px;
    line-height:1.3;
    font-weight:570;
    overflow-wrap:anywhere;
}
.list-person,.birthday-age{
    margin-top:4px;
    color:#778197;
    font-size:12px;
}
.list-chevron{
    color:#a0a9b8;
    font-size:25px;
}
.birthday-name{
    color:#151d30;
    font-size:19px;
    font-weight:650;
}
.add-birthday{
    width:100%;
    min-height:56px;
    margin-top:14px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.75);
    background:rgba(255,255,255,.72);
    box-shadow:0 9px 25px rgba(30,70,140,.12),inset 0 1px rgba(255,255,255,.9);
    color:#2468d9;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
}
.empty-state{
    text-align:center;
    padding:60px 20px;
    color:#748098;
}
.empty-icon{font-size:42px;margin-bottom:10px}
.empty-state strong{
    display:block;
    color:#3b465b;
    font-size:17px;
    margin-bottom:5px;
}

/* ---------- MODALS ---------- */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    align-items:flex-end;
    justify-content:center;
    background:rgba(10,20,45,.28);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}
.modal.show{display:flex}
.modal-content{
    width:min(100%,580px);
    max-height:90vh;
    overflow:auto;
    padding:24px 20px 32px;
    border-radius:32px 32px 0 0;
    background:rgba(250,252,255,.94);
    box-shadow:0 -12px 55px rgba(20,40,80,.22);
}
.modal-header{
    font-size:27px;
    font-weight:760;
    letter-spacing:-.04em;
    margin-bottom:18px;
}
.person-section{
    padding:18px;
    margin-bottom:15px;
    border-radius:23px;
    background:rgba(232,239,249,.72);
}
.person-title{
    color:#2466d4;
    font-size:18px;
    font-weight:720;
    margin-bottom:13px;
}
.status-toggle{display:flex;gap:7px;margin-bottom:13px}
.toggle-btn{
    flex:1;
    padding:11px 7px;
    border:1px solid rgba(100,116,139,.18);
    border-radius:14px;
    background:rgba(255,255,255,.72);
    color:#4b5563;
    font-weight:650;
}
.toggle-btn.active{
    color:white;
    background:#3478f6;
    border-color:#3478f6;
}
.shift-input-container{display:none}
.shift-input-container.show{display:block}
.input-label,.birthday-form label{
    display:block;
    color:#68748a;
    font-size:13px;
    font-weight:650;
    margin:12px 0 7px;
}
.shift-input,.todo-input,.birthday-input{
    width:100%;
    border:1px solid rgba(120,135,160,.22);
    border-radius:15px;
    background:rgba(255,255,255,.85);
    padding:14px 15px;
    font-size:16px;
    outline:none;
}
.todo-input{
    min-height:78px;
    resize:vertical;
    font-family:inherit;
}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-btn{
    flex:1;
    padding:15px;
    border:0;
    border-radius:17px;
    font-size:16px;
    font-weight:700;
}
.save-btn{background:#3478f6;color:white}
.cancel-btn{background:#e7ecf4;color:#344054}

/* ---------- BOTTOM TAB BAR ---------- */
.bottom-nav{
    position:fixed;
    z-index:900;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:min(calc(100% - 26px),620px);
    height:78px;
    padding:7px 8px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-radius:28px;
    background:rgba(249,251,255,.78);
    border:1px solid rgba(255,255,255,.86);
    box-shadow:0 15px 42px rgba(30,55,105,.20),inset 0 1px rgba(255,255,255,.9);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}
.bottom-btn{
    border:0;
    border-radius:21px;
    background:transparent;
    color:#69758a;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
}
.bottom-btn .nav-icon{
    display:block;
    font-size:25px;
    line-height:28px;
    margin-bottom:3px;
}
.bottom-btn .nav-icon svg{display:block;margin:2px auto}
.bottom-btn.active{
    color:#3478f6;
    background:rgba(52,120,246,.10);
}

/* ---------- SYNC ---------- */
.sync-status{
    position:fixed;
    z-index:1200;
    top:14px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    padding:9px 14px;
    border-radius:18px;
    background:rgba(255,255,255,.92);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    font-size:13px;
}
.sync-status.show{display:block}
.sync-status.syncing{color:#92400e}
.sync-status.synced{color:#166534}
.sync-status.error{color:#991b1b}

@media(max-width:600px){
    .container{padding:32px 14px 120px}
    .header{padding:0 22px 18px}
    h1{font-size:40px}
    .header-icon{width:58px;height:58px}
    .calendar-card{padding:20px 13px 18px;border-radius:29px}
    .month-year{font-size:25px}
    .nav-btn{width:50px;height:50px}
    .weekdays,.days{gap:7px}
    .weekday{font-size:12px}
    .day{border-radius:13px;padding:6px 4px}
    .day-number{font-size:14px}
    .day-status{font-size:10px}
    .day-indicators{top:6px;right:6px;gap:3px}
    .day-dot{width:8px;height:8px}
    .page-header{padding-left:12px;padding-right:12px}
    .page-title{font-size:34px}
}

/* ---------- ROTA PAGE PREVIEW LISTS ---------- */
.rota-preview-stack{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-top:14px;
}
.preview-card{
    padding:18px 20px 16px;
    border-radius:30px;
    background:rgba(239,245,255,.69);
    border:1px solid rgba(255,255,255,.76);
    box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.76);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}
.preview-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:14px;
}
.preview-header-left{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
}
.preview-add-btn{
    flex-shrink:0;
    width:40px;height:40px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.78);
    background:rgba(255,255,255,.72);
    box-shadow:0 6px 16px rgba(30,70,140,.12),inset 0 1px rgba(255,255,255,.9);
    color:#2468d9;
    font-size:22px;
    font-weight:700;
    display:grid;
    place-items:center;
    line-height:1;
    cursor:pointer;
}
.preview-icon{
    width:56px;height:56px;
    border-radius:18px;
    display:grid;place-items:center;
    color:white;
    font-size:27px;
    background:#3d7ff5;
    box-shadow:0 7px 18px rgba(61,127,245,.22);
}
.preview-icon.birthday{
    background:rgba(255,255,255,.62);
    color:#68748d;
    box-shadow:none;
    border:1px solid rgba(255,255,255,.75);
}
.preview-title{
    font-size:27px;
    font-weight:760;
    letter-spacing:-.045em;
}
.preview-empty{
    min-height:116px;
    border-radius:23px;
    background:rgba(255,255,255,.48);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#728099;
    padding:20px;
}
.preview-empty strong{
    font-size:17px;
    font-style:italic;
    font-weight:600;
    color:#6c7890;
    margin-bottom:6px;
}
.preview-empty span{
    font-size:15px;
    font-style:italic;
    color:#818b9f;
}
.preview-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:12px 2px;
    border-bottom:1px solid rgba(88,105,135,.12);
    cursor:pointer;
}
.preview-item:last-child{border-bottom:0}
.preview-date{
    min-width:75px;
    color:#3478f6;
    font-size:13px;
    font-weight:750;
}
.preview-content{flex:1;min-width:0}
.preview-text{
    font-size:16px;
    font-weight:570;
    color:#182033;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.preview-meta{
    color:#7a8496;
    font-size:11px;
    margin-top:3px;
}
.preview-age{
    color:#7a8496;
    font-size:12px;
    margin-top:3px;
}
.preview-more{
    margin-top:9px;
    text-align:center;
    color:#3478f6;
    font-size:13px;
    font-weight:650;
    cursor:pointer;
}
.preview-overdue .preview-text{
    text-decoration:line-through;
    color:#7d8797;
}
.preview-overdue .preview-date,
.preview-overdue .preview-meta{
    color:#8e97a6;
}
.preview-overdue .list-text{
    text-decoration:line-through;
    color:#7d8797;
}
.preview-overdue .list-date,
.preview-overdue .list-person{
    color:#8e97a6;
}
@media(max-width:600px){
    .rota-preview-stack{gap:12px;margin-top:12px}
    .preview-card{padding:17px 17px 15px}
    .preview-title{font-size:25px}
    .preview-icon{width:53px;height:53px}
}

</style>
</head>

<body>
<div class="container">

    <section class="app-page active" id="rotaPage">
        <div class="header">
            <div class="header-row">
                <h1>Rota Calendar</h1>
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="16" rx="3"></rect>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                        <line x1="8" y1="3" x2="8" y2="7"></line>
                        <line x1="16" y1="3" x2="16" y2="7"></line>
                    </svg>
                </div>
            </div>

            <div class="segmented">
                <button class="view-btn active" data-view="mine">Paul</button>
                <button class="view-btn" data-view="yours">Rachel</button>
                <button class="view-btn" data-view="both">Both</button>
            </div>
        </div>

        <div class="glass-card calendar-card">
            <div class="calendar-controls">
                <button class="nav-btn" id="prevMonth" aria-label="Previous month">‹</button>
                <div class="month-year" id="monthYear"></div>
                <button class="nav-btn" id="nextMonth" aria-label="Next month">›</button>
            </div>

            <div class="calendar" id="calendarSwipe">
                <div class="weekdays">
                    <div class="weekday">MON</div><div class="weekday">TUE</div><div class="weekday">WED</div>
                    <div class="weekday">THU</div><div class="weekday">FRI</div><div class="weekday">SAT</div><div class="weekday">SUN</div>
                </div>
                <div class="days" id="days"></div>
            </div>
        </div>

        <div class="rota-preview-stack">
            <section class="preview-card">
                <div class="preview-header">
                    <div class="preview-header-left">
                        <div class="preview-icon">
                            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                                <rect x="4" y="5.5" width="3.2" height="3.2" rx="1" fill="currentColor" stroke="none"></rect>
                                <rect x="4" y="10.4" width="3.2" height="3.2" rx="1" fill="currentColor" stroke="none"></rect>
                                <rect x="4" y="15.3" width="3.2" height="3.2" rx="1" fill="currentColor" stroke="none"></rect>
                                <line x1="10.5" y1="7.1" x2="19.5" y2="7.1"></line>
                                <line x1="10.5" y1="12" x2="19.5" y2="12"></line>
                                <line x1="10.5" y1="16.9" x2="19.5" y2="16.9"></line>
                            </svg>
                        </div>
                        <div class="preview-title">To Do List</div>
                    </div>
                    <button class="preview-add-btn" id="addTaskBtn" aria-label="Add task">＋</button>
                </div>
                <div id="rotaTodoPreview"></div>
            </section>

            <section class="preview-card">
                <div class="preview-header">
                    <div class="preview-icon birthday">🎂</div>
                    <div class="preview-title">Birthdays</div>
                </div>
                <div id="rotaBirthdayPreview"></div>
            </section>
        </div>
    </section>

    <section class="app-page" id="todoPage">
        <div class="page-header">
            <div class="page-title-wrap">
                <div class="page-icon">☷</div>
                <div>
                    <div class="page-title">To Do</div>
                    <div class="page-subtitle">All scheduled tasks</div>
                </div>
            </div>
        </div>
        <div class="glass-card list-card" id="allTodoList"></div>
    </section>

/* =========================================================
   ROLLING ROTA
   21 September 2026 starts on Week 2.
   ========================================================= */

const ROTA_START = new Date(2026, 8, 21);
const ROTA_END = new Date(2027, 8, 20);

const ROLLING_ROTA = [
    {
        paul: ["","","","","6-18","Relief","14:30-02:30"],
        rachel: ["","","6-18","7-19","14:30-02:30","14:30-02:30",""]
    },
    {

        rachel: ["7-19","14:30-02:30","18-6","","","",""]
    },
    {
        paul: ["","","6-18","6-18","14:30-02:30","14:30-02:30",""],

function dateKey(date){
    return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
}

function getRollingRota(date){
    const d = new Date(date.getFullYear(),date.getMonth(),date.getDate());

    if(d < ROTA_START || d > ROTA_END) return null;

    const daysSinceStart = Math.floor((d - ROTA_START) / 86400000);
    const weekIndex = Math.floor(daysSinceStart / 7) % 5;
    const dayIndex = daysSinceStart % 7;
    const week = ROLLING_ROTA[weekIndex];

    const paulShift = week.paul[dayIndex];
    const rachelShift = week.rachel[dayIndex];

    return {
        mine:{
            status:paulShift ? "working" : "off",
            shift:paulShift || "",
            todo:""
        },
        yours:{
            status:rachelShift ? "working" : "off",
            shift:rachelShift || "",
            todo:""
        }
    };
}

function getDayData(dateStr){
    const date = new Date(dateStr+"T00:00:00");
    const rolling = getRollingRota(date) || {
        mine:{status:"off",shift:"",todo:""},
        yours:{status:"off",shift:"",todo:""}
    };

    const override = rotaOverrides[dateStr];

    if(!override) return JSON.parse(JSON.stringify(rolling));

    return {
        mine:{...rolling.mine,...(override.mine || {})},
        yours:{...rolling.yours,...(override.yours || {})}
    };
}

function shiftColorClass(shift){
    if(!shift) return "";
    const s = shift.trim().toLowerCase();

    if(s === "relief") return "shift-relief";

    const startPart = s.split("-")[0];
    const hour = parseInt(startPart,10);

    if(hour === 14) return "shift-late";
    if(hour === 18) return "shift-night";
    return "";
}

function setDayDisplay(dayElement,statusElement,personData){
    if(personData.status === "working"){
        dayElement.classList.add("working");
        const colorClass = shiftColorClass(personData.shift);
        if(colorClass) dayElement.classList.add(colorClass);
        statusElement.classList.add("bold");
        statusElement.textContent = personData.shift || "Working";
    }else if(personData.status === "leave"){
        dayElement.classList.add("leave");
        statusElement.textContent = "Leave";
    }else{
        dayElement.classList.add("off");
        statusElement.textContent = "Day Off";
    }
}

function birthdayDaysInMonth(year,month){
    const days = new Set();

    Object.values(birthdays || {}).forEach(function(person){
        if(!person || !person.dob) return;

        const dob = new Date(person.dob+"T00:00:00");
        if(dob.getMonth() !== month) return;

        let day = dob.getDate();

        /* A 29 February birthday shows on the 28th in non-leap years. */
        if(month === 1 && day === 29){
            const leap = (year%4===0 && year%100!==0) || year%400===0;
            if(!leap) day = 28;
        }

        days.add(day);
    });

    return days;
}

function renderCalendar(){
    const daysEl = document.getElementById("days");
    const monthYear = document.getElementById("monthYear");

        const empty = document.createElement("div");
        empty.className = "day empty";
        daysEl.appendChild(empty);
    }

    const todayKey = dateKey(new Date());
    const birthdayDays = birthdayDaysInMonth(year,month);

    for(let day=1;day<=lastDay.getDate();day++){
        const date = new Date(year,month,day);
        const key = dateKey(date);
        const data = getDayData(key);
        const legacy = legacyRotaData[key] || {};

        const dayEl = document.createElement("div");
        dayEl.className = "day";

        if(key === todayKey) dayEl.classList.add("today");

        const hasTodo =

            (legacy.mine && legacy.mine.todo) ||
            (legacy.yours && legacy.yours.todo);

        if(hasTodo || birthdayDays.has(day)){
            const indicators = document.createElement("div");
            indicators.className = "day-indicators";

            if(birthdayDays.has(day)){
                const birthdayDot = document.createElement("div");

        const number = document.createElement("div");

        number.textContent = day;

        const status = document.createElement("div");
        status.className = "day-status";

        if(currentView === "mine"){

}

function collectTodoItems(){
    const items = [];

    Object.entries(rotaOverrides || {}).forEach(function([key,data]){
        if(data.mine && data.mine.todo) items.push({date:key,person:"Paul",todo:data.mine.todo});
        if(data.yours && data.yours.todo) items.push({date:key,person:"Rachel",todo:data.yours.todo});
    });

    Object.entries(legacyRotaData || {}).forEach(function([key,data]){
        const override = rotaOverrides[key];

        if(!override?.mine?.todo && data.mine && data.mine.todo){
            items.push({date:key,person:"Paul",todo:data.mine.todo});
        }

        if(!override?.yours?.todo && data.yours && data.yours.todo){
            items.push({date:key,person:"Rachel",todo:data.yours.todo});
        }
    });

    const seen = new Set();

    return items.filter(function(item){
        const id = item.date+"|"+item.person+"|"+item.todo;
        if(seen.has(id)) return false;
        seen.add(id);
        return true;
    }).sort(function(a,b){
        return a.date.localeCompare(b.date);
    });
}


function isDatePast(dateStr){
    const today = new Date();
    today.setHours(0,0,0,0);
    const d = new Date(dateStr+"T00:00:00");
    return d < today;
}

function sortTodoItems(items){
    return items.sort(function(a,b){
        const ap = isDatePast(a.date);
        const bp = isDatePast(b.date);

        /* All current/future tasks first, chronological. */
        if(ap !== bp) return ap ? 1 : -1;

        if(!ap){
            return a.date.localeCompare(b.date);
        }

        /* Overdue tasks at the bottom, most recently overdue first. */
        return b.date.localeCompare(a.date);
    });
}

function calculateAge(dobString,onDate){
    const dob = new Date(dobString+"T00:00:00");
    const d = onDate || new Date();

    let age = d.getFullYear()-dob.getFullYear();

    if(
        d.getMonth() < dob.getMonth() ||
        (d.getMonth() === dob.getMonth() && d.getDate() < dob.getDate())
    ){
        age--;
    }

    return age;
}

function getNextBirthday(dobString,fromDate){
    const dob = new Date(dobString+"T00:00:00");
    const from = fromDate ? new Date(fromDate) : new Date();

    from.setHours(0,0,0,0);

    let year = from.getFullYear();
    const month = dob.getMonth();

    function makeDate(y){
        let day = dob.getDate();

        if(month === 1 && day === 29){
            const leap = (y%4===0 && y%100!==0) || y%400===0;
            if(!leap) day = 28;
        }

        return new Date(y,month,day);
    }

    let next = makeDate(year);
    next.setHours(0,0,0,0);

    if(next < from){
        next = makeDate(year+1);
        next.setHours(0,0,0,0);
    }

    return next;
}

        name.textContent = person.name;

        const age = document.createElement("div");
        age.className = "birthday-age";
        age.textContent = person.age+" years old";

        const chevron = document.createElement("div");
        chevron.className = "list-chevron";
        chevron.textContent = "›";

        main.appendChild(name);
        main.appendChild(age);
        row.appendChild(date);
        row.appendChild(main);
        row.appendChild(chevron);

        /* Tapping a birthday currently offers deletion. */
        row.addEventListener("click",function(){
            if(confirm("Delete "+person.name+"'s birthday?")){
                delete birthdays[person.id];
                saveBirthdays();
                renderBirthdays();
                renderRotaBirthdayPreview();
                renderCalendar();
            }
        });

        list.appendChild(row);
    });
}

function openModal(key){
    selectedDate = key;
    const data = getDayData(key);
    editingData = JSON.parse(JSON.stringify(data));

    document.getElementById("modalHeader").textContent = getDisplayDate(key);

    ["mine","yours"].forEach(function(person){
        const info = editingData[person];

        document.querySelectorAll('.toggle-btn[data-person="'+person+'"]').forEach(function(b){
            b.classList.toggle("active",b.dataset.status === info.status);
        });

        document.getElementById(person+"ShiftContainer").classList.toggle("show",info.status === "working");
        document.getElementById(person+"Shift").value = info.shift || "";
        document.getElementById(person+"Todo").value = info.todo || "";
    });

    document.getElementById("modal").classList.add("show");
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
    selectedDate = null;
}

function saveDay(){
    if(!selectedDate) return;

    rotaOverrides[selectedDate] = {
        mine:{
            status:editingData.mine.status,
            shift:editingData.mine.shift,
            todo:editingData.mine.todo
        },
        yours:{
            status:editingData.yours.status,
            shift:editingData.yours.shift,
            todo:editingData.yours.todo
        }
    };

    saveData();
    renderCalendar();
    renderAllTodoList();
    renderRotaTodoPreview();
    renderRotaBirthdayPreview();
    closeModal();
}

function showPage(pageId){
    currentPage = pageId;

    document.querySelectorAll(".app-page").forEach(function(page){
        page.classList.toggle("active",page.id === pageId);
    });

    document.querySelectorAll(".bottom-btn").forEach(function(button){
        button.classList.toggle("active",button.dataset.page === pageId);
    });

    if(pageId === "todoPage") renderAllTodoList();
    if(pageId === "birthdaysPage") renderBirthdays();
    renderRotaTodoPreview();
    renderRotaBirthdayPreview();

    window.scrollTo({top:0,behavior:"smooth"});
}

function changeMonth(delta){
    currentDate.setDate(1);
    currentDate.setMonth(currentDate.getMonth()+delta);
    renderCalendar();
    renderRotaTodoPreview();
}

function setupEventListeners(){
    document.getElementById("prevMonth").addEventListener("click",function(){
        changeMonth(-1);
    });

    document.getElementById("nextMonth").addEventListener("click",function(){
        changeMonth(1);
    });

    document.querySelectorAll(".view-btn").forEach(function(button){
        button.addEventListener("click",function(){
            document.querySelectorAll(".view-btn").forEach(function(b){b.classList.remove("active");});
            button.classList.add("active");
            currentView = button.dataset.view;
            renderCalendar();
        });
    });

    document.querySelectorAll(".toggle-btn").forEach(function(button){
        button.addEventListener("click",function(){
            const person = button.dataset.person;
            const status = button.dataset.status;

            editingData[person].status = status;

            if(status !== "working"){
                editingData[person].shift = "";
            }

            document.querySelectorAll('.toggle-btn[data-person="'+person+'"]').forEach(function(b){
                b.classList.toggle("active",b === button);
            });

            document.getElementById(person+"ShiftContainer").classList.toggle("show",status === "working");
        });
    });

    document.getElementById("mineShift").addEventListener("input",function(e){
        editingData.mine.shift = e.target.value;
    });

    document.getElementById("yoursShift").addEventListener("input",function(e){
        editingData.yours.shift = e.target.value;
    });

    document.getElementById("mineTodo").addEventListener("input",function(e){
        editingData.mine.todo = e.target.value;
    });

    document.getElementById("yoursTodo").addEventListener("input",function(e){
        editingData.yours.todo = e.target.value;
    });

    document.getElementById("cancelBtn").addEventListener("click",closeModal);
    document.getElementById("saveBtn").addEventListener("click",saveDay);

    document.getElementById("addTaskBtn").addEventListener("click",function(){
        const today = new Date();
        const sameMonth =
            today.getFullYear() === currentDate.getFullYear() &&
            today.getMonth() === currentDate.getMonth();

        /* Keep the new task inside the month the rota is showing. */
        const target = sameMonth ? today : new Date(currentDate.getFullYear(),currentDate.getMonth(),1);

        openModal(dateKey(target));
        document.getElementById("mineTodo").focus();
    });

    document.getElementById("modal").addEventListener("click",function(e){
        if(e.target.id === "modal") closeModal();
    });

    document.querySelectorAll(".bottom-btn").forEach(function(button){
        button.addEventListener("click",function(){
            showPage(button.dataset.page);
        });
    });

    document.getElementById("addBirthdayBtn").addEventListener("click",function(){
        document.getElementById("birthdayName").value = "";
        document.getElementById("birthdayDob").value = "";
        document.getElementById("birthdayModal").classList.add("show");
    });

    document.getElementById("birthdayCancelBtn").addEventListener("click",function(){
        document.getElementById("birthdayModal").classList.remove("show");
    });

    document.getElementById("birthdaySaveBtn").addEventListener("click",function(){
        const name = document.getElementById("birthdayName").value.trim();
        const dob = document.getElementById("birthdayDob").value;

        if(!name || !dob){
            alert("Please enter a name and date of birth.");
            return;
        }

        birthdays["birthday_"+Date.now()] = {name:name,dob:dob};
        saveBirthdays();
        renderBirthdays();
        renderRotaBirthdayPreview();
        renderCalendar();
        document.getElementById("birthdayModal").classList.remove("show");
    });

    document.getElementById("birthdayModal").addEventListener("click",function(e){
        if(e.target.id === "birthdayModal"){
            document.getElementById("birthdayModal").classList.remove("show");
        }
    });

    const calendar = document.getElementById("calendarSwipe");

    calendar.addEventListener("touchstart",function(e){
        touchStartX = e.changedTouches[0].screenX;
    },{passive:true});

    calendar.addEventListener("touchend",function(e){
        const difference = touchStartX - e.changedTouches[0].screenX;

        if(Math.abs(difference) > 50){
            changeMonth(difference > 0 ? 1 : -1);
        }
    },{passive:true});
}

window.addEventListener("load",function(){
    setupEventListeners();

    try{
        if(typeof firebase !== "undefined"){
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            firebaseReady = true;
        }
    }catch(error){
        console.error("Firebase initialization error:",error);
        firebaseReady = false;
    }

    loadData();
    loadBirthdays();
    renderCalendar();
    renderRotaTodoPreview();
    renderRotaBirthdayPreview();
    showPage("rotaPage");
});
</script>
</body>
</html>
